[project]
name = "autoapply"
version = "2.0.2"
description = "A job-search assistant that runs on your own computer: it finds postings, scores them, drafts each application and fills in the form after you approve it."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Liam Frost" }]
keywords = ["job-search", "job-application", "automation", "ai-agent", "playwright"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "License :: Other/Proprietary License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.54.0",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "keyring>=25",
  "apscheduler>=3.10,<4",
  "playwright>=1.49",
  "anthropic>=0.60",
  "python-multipart>=0.0.9",
  "pypdf>=5",
  "python-docx>=1.1",
  "google-api-python-client>=2.140",
  "google-auth-oauthlib>=1.2",
  "cryptography>=43",
  "claude-agent-sdk>=0.2.181",
  "pystray>=0.19",
  "pillow>=10",
  "websockets>=13",  # the Discord bot's gateway connection
  "tzdata>=2026.6",  # time zone rules for employers' times (clock.py): the program's own, not the computer's
  "tzlocal>=5",      # the computer's time zone by name
]


[project.urls]
Homepage = "https://github.com/Liam-Frost/AutoApply"
Releases = "https://github.com/Liam-Frost/AutoApply/releases"
Changelog = "https://github.com/Liam-Frost/AutoApply/blob/master/CHANGELOG.md"
Issues = "https://github.com/Liam-Frost/AutoApply/issues"

[project.optional-dependencies]
nodriver = ["nodriver==0.50.99"]
chatgpt = ["openai-codex>=0.1.0b2"]  # ChatGPT subscription through the official Codex SDK (ships a ~190 MB runtime)

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
autoapply = "autoapply.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/autoapply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
