[project]
name = "autoapply"
version = "1.0.0"
description = "Local-first job application agent: discover, score, draft, approve, execute, track."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "httpx>=0.27",
  "keyring>=25",
  "apscheduler>=3.10,<4",
  "playwright>=1.49",
  "anthropic>=0.60",
  "python-multipart>=0.0.9",
  "pypdf>=5",
  "python-docx>=1.1",
  "google-api-python-client>=2.140",
  "google-auth-oauthlib>=1.2",
  "cryptography>=43",
  "claude-agent-sdk>=0.2.181",
  "pystray>=0.19",
  "pillow>=10",
]


[project.optional-dependencies]
chatgpt = ["openai-codex>=0.1.0b2"]  # ChatGPT subscription through the official Codex SDK (ships a ~190 MB runtime)

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
autoapply = "autoapply.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/autoapply"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
