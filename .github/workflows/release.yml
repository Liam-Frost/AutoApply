# Push a version tag (v1.2.3) and a release is built, checked and published:
#   the release data is checked, the tests run, every package is built and installed for real on its own system (the
#   CI workflow), and only if all of that passes a GitHub release is created with the packages and their checksums.
#
#   python scripts/release.py publish 1.2.3        (checks everything and prints the two commands below)
#   git tag -a v1.2.3 -m "AutoApply 1.2.3" && git push origin v1.2.3
#
# The tag must match the version in pyproject.toml, and changes/releases/1.2.3.json must exist (made by
# `python scripts/release.py prepare`); the notes are that release's (`release.py notes`). docs/release-workflow.md.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write        # the container image goes to this repository's registry (ghcr.io)

jobs:
  check:
    name: Tag matches the version; the release data is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml | head -1)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi
      - name: The release has a manifest, the data is valid, the generated files are up to date
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f "changes/releases/$version.json" || { echo "::error::no changes/releases/$version.json: a release is made with python scripts/release.py prepare"; exit 1; }
          uv run --no-project --python 3.12 --with pyyaml==6.0.3 python scripts/release.py validate --release "$version"
          uv run --no-project --python 3.12 --with pyyaml==6.0.3 python scripts/release.py generate --check

  build:
    needs: check
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Checksums and notes
        run: |
          cd packages
          ls -la
          sha256sum AutoApply-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          version="${GITHUB_REF_NAME#v}"
          # this release's notes, from its manifest and fragments (the same text as its section of CHANGELOG.md)
          uv run --no-project --python 3.12 --with pyyaml==6.0.3 python scripts/release.py notes "$version" > notes.md
          test -s notes.md
          {
            echo
            echo "## Downloads"
            echo
            echo "| System | File | How |"
            echo "|---|---|---|"
            echo "| Windows 10 / 11 | \`AutoApply-Setup-$version.exe\` | Run it. Not code-signed: choose *More info → Run anyway* when Windows asks. |"
            echo "| macOS 12+ | \`AutoApply-$version-macos.dmg\` | Open it and drag AutoApply to Applications. Not notarised: the first time, right-click the app and choose *Open*. |"
            echo "| Linux | \`AutoApply-$version-linux.run\` | \`sh AutoApply-$version-linux.run\` |"
            echo "| Any | \`AutoApply-$version.zip\` | Portable: unzip and run \`start.bat\` / \`./start.sh\`. |"
            echo "| A server, Docker | \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/autoapply:$version\` | \`docker compose up -d\` with the repository's \`docker-compose.yml\`, then \`docker compose exec autoapply autoapply set-admin\`. |"
            echo
            echo "Checksums are in \`SHA256SUMS.txt\`. Every package above was built by this workflow and installed and started on its own system before being published."
          } >> notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *a*|*b*|*rc*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" packages/* --title "AutoApply ${GITHUB_REF_NAME#v}" --notes-file notes.md $pre

  image:
    name: Publish the container image
    needs: publish            # after the release exists: the image is the same version, never ahead of it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build for x86-64 and ARM64, and push
        env:
          TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/autoapply"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker run --privileged --rm tonistiigi/binfmt --install arm64        # lets this x86-64 runner build the ARM64 image
          docker buildx create --use
          tags="-t $image:$version"
          case "$version" in *a*|*b*|*rc*) ;; *) tags="$tags -t $image:latest" ;; esac       # a pre-release does not become "latest"
          docker buildx build --platform linux/amd64,linux/arm64 $tags \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.version=$version" \
            --label "org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0" \
            --push .
