# Tests, then every package built and installed for real on its own system.
# Runs on pushes and pull requests; the release workflow calls it before publishing anything.
name: CI

on:
  push:
    branches: [master, main, next]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Dependencies
        run: |
          uv sync
          uv run playwright install chromium
      - name: Interface
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Tests
        run: uv run pytest -q
      # A site's work is done in the browser its sign-in lives in, so whatever the program does to a form has to work in
      # the ordinary browser as well as the automated one: every test that drives a form, once more, there.
      - name: The same forms in the ordinary browser
        env:
          AUTOAPPLY_TEST_BROWSER: nodriver
        run: uv run --extra nodriver pytest -q tests/test_repair_generic.py tests/test_sent.py tests/test_mail_link.py tests/test_held.py tests/test_pipeline.py tests/test_browser_backends.py tests/test_learned.py

  package:
    name: Portable zip and Linux package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - name: Build
        run: |
          python scripts/make_release.py
          python scripts/make_linux.py
          ls -la dist-release
      - uses: actions/upload-artifact@v7
        with:
          name: portable
          path: dist-release/AutoApply-*.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist-release/AutoApply-*-linux.run
          if-no-files-found: error

  linux:
    name: Install on Linux
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with: { name: linux }
      - name: Install without questions
        run: |
          sh AutoApply-*-linux.run --yes --no-launch --lang en --dir "$RUNNER_TEMP/autoapply" || { tail -n 80 "$RUNNER_TEMP"/autoapply/data/logs/*.log; exit 1; }
          test -x "$RUNNER_TEMP/autoapply/.venv/bin/python"
          test -x "$RUNNER_TEMP/autoapply/tools/uv"
          test -f "$HOME/.local/share/applications/autoapply.desktop"
          test "$(cat "$RUNNER_TEMP/autoapply/data/ui-lang.txt")" = en
          test ! -e "$RUNNER_TEMP/autoapply/.staged" && test ! -e "$RUNNER_TEMP/autoapply/.previous"
          ls "$RUNNER_TEMP"/autoapply/data/logs/setup-*.log
      - name: The installed copy starts and answers; the installer refuses to run over it
        run: |
          cd "$RUNNER_TEMP/autoapply"
          nohup .venv/bin/python -m autoapply.cli serve --port 8765 > serve.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/api/auth/state > /dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8765/api/auth/state > /dev/null || { cat serve.log; exit 1; }
          curl -fsS http://127.0.0.1:8765/ | grep -q 'id="app"'
          cd "$GITHUB_WORKSPACE"
          rc=0; sh AutoApply-*-linux.run --yes --no-launch --dir "$RUNNER_TEMP/autoapply" || rc=$?
          test "$rc" = 7 || { echo "the installer ended with $rc over a running copy, not 7"; exit 1; }
          test ! -e "$RUNNER_TEMP/autoapply/.staged"
          curl -fsS http://127.0.0.1:8765/api/auth/state > /dev/null || { echo "the running copy was stopped by the installer"; exit 1; }
          pkill -f "autoapply.cli serve" || true
          sleep 2
      - name: Upgrade keeps the data; a failed upgrade puts the old version back; uninstall keeps or deletes the data as asked
        run: |
          echo marker > "$RUNNER_TEMP/autoapply/data/marker.txt"
          echo old > "$RUNNER_TEMP/autoapply/backend/LEFT_FROM_AN_OLDER_VERSION.txt"
          sh AutoApply-*-linux.run --yes --no-launch --dir "$RUNNER_TEMP/autoapply"
          test "$(cat "$RUNNER_TEMP/autoapply/data/marker.txt")" = marker
          test ! -e "$RUNNER_TEMP/autoapply/backend/LEFT_FROM_AN_OLDER_VERSION.txt"
          # the dependencies cannot be had (a lock that names a package that does not exist): the version that is installed stays
          echo installed > "$RUNNER_TEMP/autoapply/backend/THE_INSTALLED_VERSION.txt"
          mkdir broken && tail -n +"$(awk '/^__PAYLOAD__$/ { print NR + 1; exit }' AutoApply-*-linux.run)" AutoApply-*-linux.run | tar -xz -C broken
          sed -i 's/^name = "fastapi"$/name = "fastapi-that-does-not-exist"/' broken/app/uv.lock
          rc=0; bash broken/install.sh --yes --no-launch --dir "$RUNNER_TEMP/autoapply" || rc=$?
          test "$rc" = 1 || { echo "a broken upgrade ended with $rc"; exit 1; }
          test -f "$RUNNER_TEMP/autoapply/backend/THE_INSTALLED_VERSION.txt" || { echo "the installed version was not put back"; exit 1; }
          "$RUNNER_TEMP/autoapply/.venv/bin/python" -c "import autoapply, fastapi"
          bash "$RUNNER_TEMP/autoapply/scripts/install-linux.sh" --uninstall --yes --dir "$RUNNER_TEMP/autoapply"
          test -f "$RUNNER_TEMP/autoapply/data/marker.txt" && test ! -e "$RUNNER_TEMP/autoapply/backend" && test ! -e "$RUNNER_TEMP/autoapply/tools"
          test ! -e "$HOME/.local/share/applications/autoapply.desktop"
          sh AutoApply-*-linux.run --yes --no-launch --dir "$RUNNER_TEMP/autoapply"
          test "$(cat "$RUNNER_TEMP/autoapply/data/marker.txt")" = marker
          bash "$RUNNER_TEMP/autoapply/scripts/install-linux.sh" --uninstall --yes --delete-data --dir "$RUNNER_TEMP/autoapply"
          test ! -e "$RUNNER_TEMP/autoapply"

  windows:
    name: Windows installer
    needs: package
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - uses: actions/download-artifact@v8
        with: { name: portable, path: dist-release }
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the installer
        run: python scripts/make_installer.py
      - name: The installer carries the program's name, version and icon
        shell: pwsh
        run: |
          $exe = Get-Item dist-release\AutoApply-Setup-*.exe
          $version = (Select-String -Path pyproject.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          $info = $exe.VersionInfo
          if ($info.FileDescription -ne 'AutoApply Setup') { throw "the file description is $($info.FileDescription)" }
          if ($info.ProductName -ne 'AutoApply' -or $info.ProductVersion.Trim() -ne $version) { throw "version details are wrong: $($info.ProductName) $($info.ProductVersion)" }
          Add-Type -AssemblyName System.Drawing
          if (-not [Drawing.Icon]::ExtractAssociatedIcon($exe.FullName)) { throw 'no icon' }
      - name: Install through the real setup window, driving itself
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist-release\AutoApply-Setup-*.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'autoapply'
          $result = Join-Path $env:RUNNER_TEMP 'setup.result'
          $p = Start-Process $exe -ArgumentList '/auto', "/result=`"$result`"", "/dir=`"$dir`"", '/lang=en', '/notasks' -Wait -PassThru
          if (Test-Path $result) { Get-Content $result }
          if ($p.ExitCode -ne 0 -or -not (Test-Path $result) -or (Get-Content $result -Raw) -notmatch '^done\|') { Get-ChildItem "$dir\data\logs" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 60 }; throw "setup ended with $($p.ExitCode)" }
          if ((Get-Content $result -Raw) -notmatch 'lang: Install AutoApply -> \S') { throw 'the window did not switch its language' }
          if (-not (Test-Path "$dir\.venv\Scripts\pythonw.exe")) { throw 'no environment' }
          if ((Get-Content "$dir\data\ui-lang.txt") -ne 'en') { throw 'the language chosen in setup was not kept' }
          if ((Test-Path "$dir\.staged") -or (Test-Path "$dir\.previous")) { throw 'setup left its working folders behind' }
          if (-not (Get-ChildItem "$dir\data\logs\setup-*.log")) { throw 'no log was kept with the data' }
          if (-not (Test-Path "$dir\AutoApplySetup.exe")) { throw 'the window for removing the program was not installed' }
      - name: The installed copy starts and answers; setup refuses to run over it
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist-release\AutoApply-Setup-*.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'autoapply'
          $p = Start-Process "$dir\.venv\Scripts\python.exe" -ArgumentList '-m', 'autoapply.cli', 'serve', '--port', '8765' -WorkingDirectory $dir -PassThru -WindowStyle Hidden
          $ok = $false
          for ($i = 0; $i -lt 40; $i++) { try { if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/auth/state).StatusCode -eq 200) { $ok = $true; break } } catch { Start-Sleep 2 } }
          if (-not $ok) { throw 'the installed copy did not answer' }
          if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/).Content -notmatch 'id="app"') { throw 'no page' }
          $again = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', "/DIR=`"$dir`"", '/LANG=en', '/TASKS=""' -Wait -PassThru
          if ($again.ExitCode -eq 0) { throw 'setup ran over a running copy' }
          $result = Join-Path $env:RUNNER_TEMP 'setup.result'
          Remove-Item $result
          $window = Start-Process $exe -ArgumentList '/auto', "/result=`"$result`"", "/dir=`"$dir`"", '/lang=en', '/notasks' -Wait -PassThru
          if ($window.ExitCode -eq 0 -or (Get-Content $result -Raw) -notmatch 'still running') { throw 'the window did not say that the program is running' }
          if (Test-Path "$dir\.staged") { throw 'setup copied files although the program was running' }
          if ((Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/api/auth/state).StatusCode -ne 200) { throw 'the running copy was stopped by setup' }
          Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath.StartsWith("$dir\.venv", 'OrdinalIgnoreCase') } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep 3
      - name: Upgrade keeps the data; uninstall keeps or deletes it as asked
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist-release\AutoApply-Setup-*.exe).FullName
          $dir = Join-Path $env:RUNNER_TEMP 'autoapply'
          function Setup { $p = Start-Process $exe -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', "/DIR=`"$dir`"", '/LANG=en', '/TASKS=""' -Wait -PassThru; if ($p.ExitCode -ne 0) { throw "setup ended with $($p.ExitCode)" } }
          # the uninstaller hands over to a copy of itself and returns: wait for what it is meant to leave
          function Remove([string[]]$more, [scriptblock]$gone) {
            Start-Process "$dir\unins000.exe" -ArgumentList (@('/VERYSILENT', '/SUPPRESSMSGBOXES') + $more) -Wait
            for ($i = 0; $i -lt 60 -and -not (& $gone); $i++) { Start-Sleep 2 }
            if (-not (& $gone)) { throw "uninstall $more did not finish: $((Get-ChildItem -Force $dir -ErrorAction SilentlyContinue).Name -join ' ')" }
          }
          'marker' | Set-Content "$dir\data\marker.txt"
          'old' | Set-Content "$dir\backend\LEFT_FROM_AN_OLDER_VERSION.txt"
          Setup
          if ((Get-Content "$dir\data\marker.txt") -ne 'marker') { throw 'data was touched by the upgrade' }
          if (Test-Path "$dir\backend\LEFT_FROM_AN_OLDER_VERSION.txt") { throw 'the upgrade left a file of the older version' }
          Remove @() { -not (Test-Path "$dir\backend") -and -not (Test-Path "$dir\.venv") -and -not (Test-Path "$dir\unins000.exe") }
          if (-not (Test-Path "$dir\data\marker.txt")) { throw 'uninstall deleted the data without being asked' }
          Setup
          if ((Get-Content "$dir\data\marker.txt") -ne 'marker') { throw 'installing again did not find the data' }
          # the last removal the way Settings > Apps does it: through the window, which goes on from a copy of itself
          $result = Join-Path $env:RUNNER_TEMP 'setup.result'
          Remove-Item $result -ErrorAction SilentlyContinue
          Start-Process "$dir\AutoApplySetup.exe" -ArgumentList '/uninstall', '/auto', '/deletedata', '/lang=en', "/result=`"$result`"" -Wait
          for ($i = 0; $i -lt 90 -and -not (Test-Path $result); $i++) { Start-Sleep 2 }
          if (-not (Test-Path $result) -or (Get-Content $result -Raw) -notmatch '^done\|') { throw 'removing through the window did not finish' }
          for ($i = 0; $i -lt 15 -and (Test-Path $dir); $i++) { Start-Sleep 2 }
          if (Test-Path $dir) { throw "removing with the data left: $((Get-ChildItem -Force $dir).Name -join ' ')" }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist-release/AutoApply-Setup-*.exe
          if-no-files-found: error

  macos:
    name: macOS package
    needs: package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: portable, path: dist-release }
      - name: Build the disk image
        run: bash scripts/make_macos.sh
      - name: Set up from the app inside the image, without questions
        run: |
          hdiutil attach dist-release/AutoApply-*-macos.dmg -mountpoint /Volumes/AutoApplyTest -nobrowse
          export AUTOAPPLY_HOME="$RUNNER_TEMP/autoapply" AUTOAPPLY_LANG=en
          /Volumes/AutoApplyTest/AutoApply.app/Contents/MacOS/AutoApply --yes --setup-only || { tail -n 80 "$AUTOAPPLY_HOME"/data/logs/*.log; exit 1; }
          test -x "$AUTOAPPLY_HOME/.venv/bin/python"
          test -x "$AUTOAPPLY_HOME/tools/uv"
          test "$(cat "$AUTOAPPLY_HOME/data/ui-lang.txt")" = en
          test ! -e "$AUTOAPPLY_HOME/.staged" && test ! -e "$AUTOAPPLY_HOME/.previous"
          # a newer app over a copy that is running: it says so and changes nothing
          echo 0.0.0 > "$AUTOAPPLY_HOME/.installed-version"
          (cd "$AUTOAPPLY_HOME" && exec .venv/bin/python -m autoapply.cli serve --port 8766 > serve-running.log 2>&1) &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8766/api/auth/state > /dev/null 2>&1 && break; sleep 2; done
          ls "$AUTOAPPLY_HOME/data/run"
          rc=0; /Volumes/AutoApplyTest/AutoApply.app/Contents/MacOS/AutoApply --yes --setup-only || rc=$?
          pkill -f "autoapply.cli serve --port 8766" || true
          test "$rc" = 7 || { echo "set-up over a running copy ended with $rc, not 7"; exit 1; }
          # and once it is quit, the newer version goes in and the data stays
          echo marker > "$AUTOAPPLY_HOME/data/marker.txt"
          sleep 2
          /Volumes/AutoApplyTest/AutoApply.app/Contents/MacOS/AutoApply --yes --setup-only || { tail -n 80 "$AUTOAPPLY_HOME"/data/logs/*.log; exit 1; }
          test "$(cat "$AUTOAPPLY_HOME/data/marker.txt")" = marker
          test "$(cat "$AUTOAPPLY_HOME/.installed-version")" != 0.0.0
          plutil -lint /Volumes/AutoApplyTest/AutoApply.app/Contents/Info.plist
          test -L /Volumes/AutoApplyTest/Applications
          hdiutil detach /Volumes/AutoApplyTest
      - name: The installed copy starts and answers
        run: |
          cd "$RUNNER_TEMP/autoapply"
          nohup .venv/bin/python -m autoapply.cli serve --port 8765 > serve.log 2>&1 &
          for i in $(seq 1 40); do curl -fsS http://127.0.0.1:8765/api/auth/state > /dev/null 2>&1 && break; sleep 2; done
          curl -fsS http://127.0.0.1:8765/api/auth/state > /dev/null || { cat serve.log; exit 1; }
          curl -fsS http://127.0.0.1:8765/ | grep -q 'id="app"'
          .venv/bin/python -c "from autoapply import launcher; launcher.make_icon('running'); import pystray; print('menu-bar support:', pystray.Icon.__module__)"
          pkill -f "autoapply.cli serve" || true
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: dist-release/AutoApply-*-macos.dmg
          if-no-files-found: error

  server:
    name: A server without a screen (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: Dependencies, the browser, a virtual screen and its viewer
        run: |
          uv sync
          uv run playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb x11vnc
      - name: The remote window, the virtual screen, secrets without a keyring, the doctor, carried sign-ins
        env:
          AUTOAPPLY_REQUIRE_SCREEN_TESTS: "1"
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          uv run pytest -q -rs tests/test_vscreen.py tests/test_remote.py tests/test_secrets_store.py tests/test_doctor.py tests/test_transfer.py tests/test_prepare.py tests/test_fetch_uv.py
      - name: The doctor on this computer - no screen, a virtual one
        run: |
          unset DISPLAY WAYLAND_DISPLAY
          export AUTOAPPLY_DATA="$RUNNER_TEMP/d/data" AUTOAPPLY_KNOWLEDGE="$RUNNER_TEMP/d/knowledge"
          uv run autoapply doctor --deep --json | tee doctor.json
          python3 - <<'PY'
          import json
          found = {f["id"]: f for f in json.load(open("doctor.json"))}
          assert found["browser"]["level"] == "ok", found["browser"]
          assert found["screen"]["level"] == "ok", found["screen"]
          assert not [f for f in found.values() if f["level"] == "bad"], found
          PY

  docker:
    name: Container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: docker build -t autoapply:ci .
      - name: It starts, as an ordinary user, and reports itself healthy
        run: |
          docker run -d --name aa --shm-size=1g -p 127.0.0.1:8000:8000 -e AUTOAPPLY_TRUSTED_NETWORKS=172.16.0.0/12 -v aa-data:/data autoapply:ci
          for i in $(seq 1 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' aa)" = healthy ] && break; sleep 2; done
          [ "$(docker inspect -f '{{.State.Health.Status}}' aa)" = healthy ] || { docker logs aa; exit 1; }
          test "$(docker exec aa id -u)" = 10001
          curl -fsS http://127.0.0.1:8000/ | grep -q 'id="app"'
      - name: It lacks nothing the program needs
        run: |
          docker exec aa autoapply doctor --deep --json | tee doctor.json
          python3 - <<'PY'
          import json
          found = {f["id"]: f for f in json.load(open("doctor.json"))}
          for name in ("browser", "screen", "converter", "fonts"):
              assert found[name]["level"] == "ok", found[name]
          assert found["secrets"]["level"] == "warn", found["secrets"]        # in a file, its key beside the data: said, not hidden
          assert not [f for f in found.values() if f["level"] == "bad"], found
          PY
      - name: A browser window opens on a virtual screen, and the screen can be viewed
        run: |
          docker exec aa python -c "
          import os, socket
          from playwright.sync_api import sync_playwright
          from autoapply import vscreen
          s = vscreen.private()
          with sync_playwright() as p:
              b = p.chromium.launch(headless=False, env={**os.environ, **s.env()})
              page = b.new_page()
              page.set_content('<title>on the virtual screen</title>')
              assert page.title() == 'on the virtual screen'
              b.close()
          with socket.create_connection(('127.0.0.1', s.port), timeout=5) as c:
              assert c.recv(12).startswith(b'RFB 003.')
          s.stop()
          print('ok')
          "
      - name: The administrator is set in the terminal, signs in, and is still signed in after a restart
        run: |
          printf 'ci-only-%s%s\n' "$RANDOM" "$RANDOM$RANDOM" > pw
          docker exec -i aa autoapply set-admin --user ci --password-stdin < pw
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/overview)" = 401
          python3 -c "import json; print(json.dumps({'user': 'ci', 'password': open('pw').read().strip()}))" > login.json
          curl -fsS -c jar -H 'Content-Type: application/json' --data @login.json http://127.0.0.1:8000/api/auth/login > /dev/null
          curl -fsS -b jar http://127.0.0.1:8000/api/overview > /dev/null
          test "$(curl -fsS -b jar http://127.0.0.1:8000/api/remote)" = "[]"
          docker exec aa python -c "from autoapply import secrets; secrets.put('ci.probe', 'kept'); assert secrets.backend() == 'file', secrets.backend()"
          docker restart aa
          for i in $(seq 1 60); do [ "$(docker inspect -f '{{.State.Health.Status}}' aa)" = healthy ] && break; sleep 2; done
          curl -fsS -b jar http://127.0.0.1:8000/api/overview > /dev/null || { docker logs aa; exit 1; }
          docker exec aa sh -c 'ls /data/data/secrets.bin /data/data/access.json'
          docker exec aa python -c "from autoapply import secrets; assert secrets.get('ci.probe') == 'kept'"      # a secret stored before the restart is read after it
          rm -f pw login.json jar

  collect:
    name: Rehearse the release (collect, checksum, notes)
    needs: [test, linux, windows, macos, server, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: packages
          merge-multiple: true
      - name: Every package is there, once
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml | head -1)"
          cd packages
          ls -la
          for f in "AutoApply-$version.zip" "AutoApply-Setup-$version.exe" "AutoApply-$version-macos.dmg" "AutoApply-$version-linux.run"; do
            test -s "$f" || { echo "::error::missing package $f"; exit 1; }
          done
          test "$(ls | wc -l)" = 4
          sha256sum AutoApply-* | tee SHA256SUMS.txt
      - name: The changelog has a section for this version
        run: |
          version="$(sed -n 's/^version *= *"\(.*\)"/\1/p' pyproject.toml | head -1)"
          awk -v v="$version" '$0 ~ "^## \\[?" v "\\]?" { on = 1; next } on && /^## / { exit } on { print }' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for $version"; exit 1; }
          head -20 notes.md
